    const state = { currentIndex: 0 };

    const plot = document.getElementById("timeline_plot");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const eventSelect = document.getElementById("eventSelect");
    const statusText = document.getElementById("statusText");

    for (let i = 0; i < events.length; i++) {
      const option = document.createElement("option");
      option.value = String(i);
      option.textContent = `${i + 1}. ${events[i].event}`;
      eventSelect.appendChild(option);
    }

    function isoToDate(isoStr) {
      return new Date(isoStr + "T00:00:00");
    }

    function buildData(index) {
      const selected = events[index];

      const connectorTraces = [];
      const unselectedX = [];
      const unselectedY = [];
      const unselectedCustom = [];

      const unselectedLabelX = [];
      const unselectedLabelY = [];
      const unselectedLabelText = [];

      for (let i = 0; i < events.length; i++) {
        const ev = events[i];
        const x = isoToDate(ev.date);

        connectorTraces.push({
          x: [x, x],
          y: [0, ev.label_y],
          mode: "lines",
          line: { width: 1, color: "lightgray", dash: "dot" },
          hoverinfo: "skip",
          showlegend: false,
          type: "scatter"
        });

        if (i !== index) {
          unselectedX.push(x);
          unselectedY.push(0);
          unselectedCustom.push([ev.event, ev.display_date]);

          unselectedLabelX.push(x);
          unselectedLabelY.push(ev.label_y);
          unselectedLabelText.push(ev.event);
        }
      }

      return [
        {
          x: [isoToDate(events[0].date), isoToDate(events[events.length - 1].date)],
          y: [0, 0],
          mode: "lines",
          line: { width: 3, color: "gray" },
          hoverinfo: "skip",
          showlegend: false,
          type: "scatter"
        },
        ...connectorTraces,
        {
          x: unselectedX,
          y: unselectedY,
          mode: "markers",
          marker: { size: 11, color: "#4C78A8" },
          customdata: unselectedCustom,
          hovertemplate: "<b>%{customdata[0]}</b><br>%{customdata[1]}<extra></extra>",
          showlegend: false,
          type: "scatter"
        },
        {
          x: [isoToDate(selected.date)],
          y: [0],
          mode: "markers",
          marker: { size: 20, color: "#E45756", line: { width: 2, color: "white" } },
          customdata: [[selected.event, selected.display_date]],
          hovertemplate: "<b>%{customdata[0]}</b><br>%{customdata[1]}<extra></extra>",
          showlegend: false,
          type: "scatter"
        },
        {
          x: unselectedLabelX,
          y: unselectedLabelY,
          mode: "text",
          text: unselectedLabelText,
          textposition: "middle center",
          textfont: { size: 12, color: "#444444" },
          hoverinfo: "skip",
          showlegend: false,
          type: "scatter"
        }
      ];
    }

    function buildLayout(selected) {
      return {
        title: "Interactive Timeline",
        template: "plotly_white",
        hovermode: "closest",
        showlegend: false,
        margin: { l: 40, r: 40, t: 80, b: 40 },
        xaxis: {
          title: "Date",
          showgrid: false,
          zeroline: false,
          tickformat: "%b %Y"
        },
        yaxis: {
          visible: false,
          range: [-3.2, 3.2]
        },
        annotations: [
          {
            x: isoToDate(selected.date),
            y: selected.label_y,
            text: selected.event,
            showarrow: false,
            bgcolor: "#E45756",
            bordercolor: "#333333",
            borderwidth: 1,
            borderpad: 4,
            font: {
              size: 13,
              color: "white"
            },
            align: "center"
          }
        ]
      };
    }

    function updateControls() {
      const selected = events[state.currentIndex];
      eventSelect.value = String(state.currentIndex);
      statusText.textContent = `Selected: ${selected.event} (${selected.display_date})`;
      prevBtn.disabled = state.currentIndex <= 0;
      nextBtn.disabled = state.currentIndex >= events.length - 1;
    }

    function render(index) {
      state.currentIndex = index;
      const selected = events[index];
      Plotly.react(plot, buildData(index), buildLayout(selected), { responsive: true });
      updateControls();
    }

    prevBtn.onclick = function () {
      if (state.currentIndex > 0) {
        render(state.currentIndex - 1);
      }
    };

    nextBtn.onclick = function () {
      if (state.currentIndex < events.length - 1) {
        render(state.currentIndex + 1);
      }
    };

    eventSelect.onchange = function (e) {
      render(Number(e.target.value));
    };

    render(0);
